name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Lint & Test ─────────────────────────────────
  lint-and-test:
    runs-on: ubuntu-latest

    # Service containers (same versions as docker-compose.yml)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: techstore_db
          POSTGRES_USER: techstore_user
          POSTGRES_PASSWORD: techstore_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U techstore_user -d techstore_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.ci
      DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DATABASE_URL: postgres://techstore_user:techstore_pass@localhost:5432/techstore_db
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      ZARINPAL_MERCHANT_ID: test-merchant-id
      ZARINPAL_SANDBOX: "True"
      SECURE_SSL_REDIRECT: "False"

    steps:
      # ── Checkout ─────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Python Setup ─────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── Cache pip ────────────────────────────────────────
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ── Install dependencies ─────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # ── Linting ──────────────────────────────────────────
      - name: Run Ruff linter
        run: ruff check .

      - name: Run Black format check
        run: black --check .

      - name: Run isort import order check
        run: isort --check-only --profile black .

      # ── Django checks ────────────────────────────────────
      - name: Run Django system check
        run: python manage.py check

      # ── Run tests ────────────────────────────────────────
      - name: Run tests with coverage
        run: |
          python -m pytest \
            --cov=accounts \
            --cov=catalog \
            --cov=inventory \
            --cov=cart \
            --cov=orders \
            --cov=payments \
            --cov=reviews \
            --cov=promotions \
            --cov=notifications \
            --cov=support \
            --cov-report=term-missing \
            --cov-report=html:htmlcov \
            --cov-report=xml:coverage.xml \
            -v

      # ── Upload coverage ──────────────────────────────────
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 30

      - name: Upload coverage to Codecov (optional)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ── Job 2: Docker Build ────────────────────────────────
  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (web)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: techstore:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
