[tool:pytest]
DJANGO_SETTINGS_MODULE = config.settings.dev
python_files = tests.py test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --tb=short
    -q
    --cov=accounts
    --cov=catalog
    --cov=inventory
    --cov=cart
    --cov=orders
    --cov=payments
    --cov=reviews
    --cov=promotions
    --cov=notifications
    --cov=support
    --cov-report=term-missing
    --cov-report=html:htmlcov

[flake8]
max-line-length = 120
exclude = .git,__pycache__,migrations,venv,.venv
